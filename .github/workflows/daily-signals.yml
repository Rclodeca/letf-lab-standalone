name: Daily LETF signals

on:
  # ~22:00 UTC on weekdays. This is after the US market close year-round:
  # 18:00 ET during EDT, 17:00 ET during EST. GitHub cron has no timezone,
  # so this fixed UTC time drifts by an hour across DST but always lands
  # after the 16:00 ET close. Adjust if you want a specific ET time.
  #
  # Two staggered triggers, not one: GitHub's schedule event is best-effort
  # and has been observed to silently drop entirely (no queued/failed run,
  # no error) on separate days even after moving off the top of the hour.
  # A second trigger 20 minutes later gives a fallback if the first is
  # dropped. notify.daily_signals dedupes on the trading-day date already
  # recorded in state, so a normal day where both fire still sends exactly
  # one Telegram message.
  schedule:
    - cron: "7 22 * * 1-5"
    - cron: "27 22 * * 1-5"
  # Manual trigger for testing.
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if already notified for today's trading date (bypasses the dedup guard)"
        type: boolean
        default: false

# Needed so the job can commit the updated state file back to the repo.
permissions:
  contents: write

concurrency:
  group: daily-signals
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      PRICE_CACHE_DIR: ./data/prices
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reuse the app's engine (ai_swing) and its dependencies. Editable install
      # is required: the app's pyproject declares packages = ["ai_swing"] only,
      # so a wheel build omits subpackages (ai_swing.data, .services, …). Editable
      # puts the full source tree on the path, matching local `make install`.
      - name: Install backend package
        run: pip install -e ./backend

      # Persist the parquet price cache between runs on the SAME day so reruns
      # only fetch recent bars. Keyed by date, with no restore-keys fallback:
      # GitHub caches are immutable per key, so a fixed key froze the history
      # at its first save while each run re-downloaded only the last ~30 days
      # on top of it. Prices are dividend-adjusted, so that mixed adjustment
      # bases and could flip near-zero momentum scores (e.g. the HAA TIP
      # canary). A fresh key each day forces a consistent full-history fetch
      # on the first run of the day.
      - name: Get date for cache key
        id: cache-date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/prices
          key: price-cache-v2-${{ steps.cache-date.outputs.date }}

      - name: Compute signals and notify
        run: python -m notify.daily_signals ${{ inputs.force && '--force' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- notify/state/last_signals.json; then
            git add notify/state/last_signals.json
            git commit -m "chore: update signal state [skip ci]"
            git push
          else
            echo "No signal state change to commit."
          fi
